<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='38' fill='%23031433'/></svg>">
<style>
  /* ===== 方案B · 中轴仪式版（终版：标题 128px） =====
     与《硅与海-Hero方案B-实现规格.md》最终编辑状态对齐：
     主标题 128px / 副标题 45px / 栏目说明 28px / CTA 32px，基准 1920×1080。
     与规格的两处有意差异：
     ① 标题字体用自托管子集（「硅与海」三字形 1.6KB woff2），不走 Google Fonts
        css2 @import——国内访问会阻塞渲染；正文用系统黑体栈，零第三方请求。
     ② 球体视觉由全幅背景视频承担（球体+水面+水波纹不可拆分），
        即规格中的 .hero__orb 球体层。 */
  @font-face {
    font-family: 'Noto Serif SC';
    font-style: normal;
    font-weight: 700;
    font-display: swap;
    src: url('fonts/silicon-sea-serif-700.woff2') format('woff2');
  }

  :root {
    --ink: #191A2E;
    --text: #4E5268;
    --accent: #6A5BE0;
    --muted: #5D6178;
    --bg: #E7E8F1;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    color: var(--text);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  .hero {
    position: relative;
    min-height: 100vh;
    min-height: 100svh;
    display: grid;
    grid-template-rows: auto 1fr auto;   /* 顶部文字块 | 球体呼吸区 | 底部文字块 */
    justify-items: center;
    text-align: center;
    overflow: hidden;
  }

  /* 背景视频：球体 + 水波纹，全幅铺底，即规格中的「球体层」 */
  .bg-video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    pointer-events: none;
  }

  /* 导航：右上纯文字（位置按规格 top 62px / right 83px @1920；
     字号与间距按用户要求定稿：17px，两链接间距较 2.5em 收 4px） */
  .hero__nav {
    position: absolute;
    top: 3.2vw;                          /* 62px @1920 */
    right: 4.3vw;                        /* 83px @1920 */
    display: flex;
    gap: 34.5px;                         /* 2.5em(42.5px) - 8px：「往期日报」累计右移 8px（两次各 4px） */
    font: 500 17px/1 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    color: var(--text);
    z-index: 2;
  }
  .hero__nav a { color: inherit; text-decoration: none; transition: color .2s; }
  .hero__nav a:hover { color: var(--ink); }

  /* 顶部组：眉题 + 主标题（规格：眉题 top 62px、主标题 top 121px） */
  .hero__top {
    margin-top: 3.2vw;                   /* 62px @1920 */
    z-index: 1;
    padding-left: 24px;
    padding-right: 24px;
  }
  .hero__eyebrow {
    margin: 0 0 .8em;
    font: 500 clamp(12px, 1.46vw, 28px)/1.2 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    letter-spacing: .36em;
    text-indent: .36em;                  /* 抵消末字字距，保持光学居中 */
    text-transform: uppercase;
    color: var(--accent);
  }
  .hero__title {
    margin: 0;
    font: 700 clamp(56px, 6.67vw, 128px)/1.05 'Noto Serif SC', 'Songti SC', 'STZhongsong', 'SimSun', serif;
    color: var(--ink);
  }

  /* 底部组：副标题 + 栏目说明 + CTA（钉在视口底部，CTA 距底约 68px @1080） */
  .hero__bottom {
    grid-row: 3;
    align-self: end;
    margin-bottom: 6.3vh;                /* 68px @1080 */
    display: grid;
    justify-items: center;
    z-index: 1;
    padding-left: 16px;
    padding-right: 16px;
  }
  .hero__subtitle {
    margin: 5px 0 .9em;                  /* 下移 5px（用户定稿） */
    font: 400 clamp(20px, 2.34vw, 45px)/1.3 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    color: var(--text);
  }
  .hero__meta {
    margin: 0 0 calc(2.3em - 5px);       /* 两行文字各下移 5px；收紧底距补偿，CTA 位置不变 */
    font: 400 clamp(13px, 1.46vw, 28px)/1.2 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    letter-spacing: .14em;
    text-indent: .14em;
    color: var(--muted);
  }
  .hero__cta {
    display: inline-block;
    padding: .95em 1.5em;                /* 按钮高度较原收 5px @1440（60→55） */
    border-radius: 999px;
    background: var(--ink);
    color: #fff;
    font: 500 clamp(14px, 1.32vw, 32px)/1 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;  /* 字号 24→19 @1440，缩 5px */
    text-decoration: none;
    transition: transform .2s ease, box-shadow .2s ease;
  }
  .hero__cta:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 32px rgba(25, 26, 46, .22);
  }

  /* 动效：入场淡入上移 */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .fade-up {
    opacity: 0;
    animation: fadeUp .9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
  .d100 { animation-delay: .1s; }
  .d300 { animation-delay: .3s; }
  .d500 { animation-delay: .5s; }
  /* 「减少动效」用户：跳过入场动画，直接呈现终态 */
  @media (prefers-reduced-motion: reduce) {
    .fade-up { animation: none; opacity: 1; }
    .hero__cta { transition: none; }
  }

  /* 手机端微调（规格基准为 1920×1080，窄屏补竖向空间） */
  @media (max-width: 640px) {
    .hero__eyebrow { letter-spacing: .24em; text-indent: .24em; }
    .hero__nav { top: 20px; right: 6vw; gap: 1.6em; }
    .hero__top { margin-top: 7vh; }
  }
</style>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<script>
/* 版本自愈：拉远端 version.txt 与页面内嵌版本号比对，不一致则换新 URL 重载 */
(function(){
  var VER="v202609232159";
  try{
    var x=new XMLHttpRequest();
    x.open('GET','version.txt?_='+Date.now(),true);
    x.onreadystatechange=function(){
      if(x.readyState!==4||x.status!==200) return;
      var v=(x.responseText||'').trim().split('\n')[0].trim();
      if(!v||v===VER) return;
      var k="vb_"+v;
      if(sessionStorage.getItem(k)==="1") return;
      sessionStorage.setItem(k,"1");
      var u=location.href.split("#")[0].split("?")[0];
      location.replace(u+'?'+v+'&_='+Date.now());
    };
    x.send();
  }catch(e){}
})();
</script>
</head>
<body>
<section class="hero">
  <video class="bg-video" aria-hidden="true" autoplay muted loop playsinline preload="auto"
         poster="hero-poster.jpg" data-src="hero-bg.mp4"></video>
  <script>
  /* 视频降级：默认只显示 36KB 海报帧；桌面 + 网络 + 未开启「减少动效」时才加载 1.1MB 背景
     视频（同源 CDN，CRF26 压缩，较原 5.0MB 外链减 78%）。弱网/手机/减少动效用户零视频流量，
     视频加载失败时 poster 自然兜底，不会黑屏。 */
  (function(){
    var v = document.querySelector('.bg-video');
    if(!v || !v.dataset.src) return;
    var c = navigator.connection || {};
    var slow = c.saveData || /2g/i.test(c.effectiveType || '');
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var narrow = window.matchMedia('(max-width: 640px)').matches;
    if(reduce || narrow || slow) return;
    v.src = v.dataset.src;
    if(v.play) v.play().catch(function(){});
  })();
  </script>

  <nav class="hero__nav fade-up d100">
    <a href="archive.html?v202609232159">往期日报</a>
    <a href="about.html?v202609232159">关于我们</a>
  </nav>

  <div class="hero__top fade-up d300">
    <p class="hero__eyebrow">SILICON &amp; SEA · DAILY BRIEF</p>
    <h1 class="hero__title">硅与海</h1>
  </div>

  <div class="hero__bottom fade-up d500">
    <p class="hero__subtitle">10 分钟读懂今天</p>
    <p class="hero__meta">具身智能 × 智能硬件出海 · 日报</p>
    <a class="hero__cta" href="today.html?v202609232159">今日日报</a>
  </div>
</section>
</body>
</html>
