<script>
/* 版本自愈：拉远端 version.txt 与页面内嵌版本号比对，不一致则换新 URL 重载 */
(function(){
  var VER="v202609260837";
  try{
    var x=new XMLHttpRequest();
    x.open('GET','version.txt?_='+Date.now(),true);
    x.onreadystatechange=function(){
      if(x.readyState!==4||x.status!==200) return;
      var v=(x.responseText||'').trim().split('\n')[0].trim();
      if(!v||v===VER) return;
      var k="vb_"+v;
      if(sessionStorage.getItem(k)==="1") return;
      sessionStorage.setItem(k,"1");
      var u=location.href.split("#")[0].split("?")[0];
      location.replace(u+'?'+v+'&_='+Date.now());
    };
    x.send();
  }catch(e){}
})();
</script>

<script>
/* 今日日报：自动定位归档中日期最新的一期 */
fetch('digests.json?v202609260837').then(function(r){
  if(!r.ok)throw new Error('HTTP '+r.status);
  return r.json();
}).then(function(data){
  var items=(data.digests||[]).slice().sort(function(a,b){return a.date<b.date?1:-1});
  if(!items.length)throw new Error('归档为空');
  var latest=items[0];
  var doc=document.getElementById('doc');
  var meta='<div class="meta">'
    + '<span class="badge">今日日报 · 第 '+latest.issue+' 期</span>'
    + '<span>'+latest.date+'</span>'
    + '<span class="meta-right">每天 06:30 自动生成</span>'
    + '</div>';
  return fetch('digests/'+latest.date+'.md?v202609260837').then(function(r){
    if(!r.ok)throw new Error('HTTP '+r.status);
    return r.text();
  }).then(function(t){
    /* 页头已显示期数与日期，去掉正文首个 H1 避免重复 */
    t=t.replace(/^#\s+[^\n]*\n+/,'');
    /* 去掉生成参数块 */
    t=t.replace(/^>\s*生成参数[^\n]*\n+/m,'');
    /* 数据看板及之后的附录全部移到「数据目录」页，今日页只保留日报正文 */
    var cut=t.search(/^## 数据看板/m);
    if(cut>-1)t=t.slice(0,cut);
    doc.innerHTML=meta+buildGradeFilter()+md(t);
    rewriteLinks(doc,'digests/'+latest.date+'.md');
    fxMarkGrades(doc);
    fxInit();
    document.title='第 '+latest.issue+' 期 · '+latest.date+' · 硅与海';
  });
}).catch(function(e){
  document.getElementById('doc').innerHTML=
    '<div class="err"><b>日报加载失败</b><br>'+e.message
    +'<br><br>请稍后重试，或前往 <a href="archive.html?v202609260837">往期日报</a> 查看历史归档。</div>';
});
</script>
